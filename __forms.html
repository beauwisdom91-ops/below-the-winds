<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Netlify form detection</title>
</head>
<body>
  <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input type="hidden" name="form-name" value="contact" />
    <input name="bot-field" />
    <input name="name" />
    <input name="email" type="email" />
    <textarea name="message"></textarea>
  </form>
  <form name="order" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input type="hidden" name="form-name" value="order" />
    <input name="bot-field" />
    <input name="book_id" />
    <input name="title" />
    <input name="name" />
    <input name="email" type="email" />
    <textarea name="message"></textarea>
  </form>
  <form name="want" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input type="hidden" name="form-name" value="want" />
    <input name="bot-field" />
    <input name="name" />
    <input name="email" type="email" />
    <input name="title" />
    <input name="author" />
    <textarea name="message"></textarea>
  </form>
</body>
</html>
