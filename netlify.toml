[build]
  publish = "."
  command = "npm ci --omit=dev"

[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=300"

[[redirects]]
  from = "/shop"
  to = "/catalog.html"
  status = 301

[[redirects]]
  from = "/amazon"
  to = "https://www.amazon.com/s?k=BelowtheWinds&i=stripbooks"
  status = 302

[[redirects]]
  from = "/catalog"
  to = "/catalog.html"
  status = 200

