<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contact — Below the Winds</title>
  <link rel="stylesheet" href="css/site.css" />
</head>
<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="wordmark" href="index.html">Below the Winds<span>Johnson · Northwest Arkansas</span></a>
      <nav>
        <a href="index.html">Home</a>
        <a href="catalog.html">Catalog</a>
        <a href="about.html">About</a>
        <a href="shipping.html">Shipping</a>
        <a href="contact.html" aria-current="page">Contact</a>
      </nav>
    </div>
  </header>
  <main class="section">
    <div class="wrap">
      <p class="kicker">Write the shop</p>
      <h2>Contact</h2>
      <p class="note">For order issues, use Amazon first. For wants, editions, and wholesale questions, use this form or shop@belowthewinds.com.</p>
      <form name="contact" method="POST" netlify netlify-honeypot="bot-field">
        <input type="hidden" name="form-name" value="contact" />
        <p style="display:none"><label>Don’t fill this <input name="bot-field" /></label></p>
        <label for="name">Name</label>
        <input id="name" name="name" required />
        <label for="email">Email</label>
        <input id="email" name="email" type="email" required />
        <label for="message">Message</label>
        <textarea id="message" name="message" rows="6" required></textarea>
        <button class="btn solid" type="submit">Send</button>
      </form>
    </div>
  </main>
  <footer class="site-footer">
    <div class="wrap">
      <div>shop@belowthewinds.com</div>
      <div>Amazon store name: BelowtheWinds</div>
    </div>
  </footer>
</body>
</html>
